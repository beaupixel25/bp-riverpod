# Written at project-creation time from the design bundle's
# appIcons.development entry. The `-development` suffix must stay equal
# to the gradle productFlavors name: it selects
# android/app/src/development/res/ and names the iOS
# AppIcon-development.appiconset.
#
# Re-run after editing, from this directory:
#   dart run flutter_launcher_icons
# One run loops every flutter_launcher_icons-*.yaml it finds.
flutter_launcher_icons:
  image_path: "assets/app_icons/app_icon_dev.png"
  android: "ic_launcher"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#141414"
