name: core
description: Shared domain, DI, theme, and components for bp-riverpod
publish_to: none
version: 0.0.1

resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_svg: ^2.0.10+1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.2
  responsive_framework: ^1.5.1
  riverpod_annotation: ^4.0.2

dev_dependencies:
  build_runner: ^2.15.0
  flutter_gen_runner: ^5.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  go_router_builder: ^4.3.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/assets/icons/
    - lib/assets/logos/
    - lib/assets/illustrations/
  fonts:
    - family: Basis Grotesque
      fonts:
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-light-webfont.woff2
          weight: 300
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-regular-webfont.woff2
          weight: 400
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-italic-webfont.woff2
          weight: 400
          style: italic
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-medium-webfont.woff2
          weight: 500
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-bold-webfont.woff2
          weight: 700
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-bolditalic-webfont.woff2
          weight: 700
          style: italic
        - asset: lib/fonts/Basis Grotesque/basisgrotesque-black-webfont.woff2
          weight: 900
    - family: Neue Haas Grotesk Display
      fonts:
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplayxxthin-webfont.woff2
          weight: 100
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplayxthin-webfont.woff2
          weight: 200
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplaylight-webfont.woff2
          weight: 300
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplayroman-webfont.woff2
          weight: 400
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplayromanitalic-webfont.woff2
          weight: 400
          style: italic
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplaymedium-webfont.woff2
          weight: 500
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplaybold-webfont.woff2
          weight: 700
        - asset: lib/fonts/Neue Haas Grotesk Display/neuehaasdisplayblack-webfont.woff2
          weight: 900
    - family: Basis Grotesque Mono
      fonts:
        - asset: lib/fonts/Basis Grotesque Mono/basisgrotesque-mono-webfont.woff2
          weight: 400
        - asset: lib/fonts/Basis Grotesque Mono/basisgrotesque-monobold-webfont.woff2
          weight: 700
    - family: Inconsolata
      fonts:
        - asset: lib/fonts/Inconsolata/inconsolata-regular.woff2
          weight: 400
